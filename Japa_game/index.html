  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<script>
  // Development aid: show errors on screen (the test phone has no visible console).
  const showError = (msg) => document.body.insertAdjacentHTML('beforeend',
    `<pre style="position:fixed;left:0;right:0;bottom:0;z-index:99;margin:0;padding:8px;background:#C74742;color:#fff;font:12px/1.3 monospace;white-space:pre-wrap">${String(msg).replace(/</g, '&lt;')}</pre>`);
  addEventListener('error', (e) => showError(`${e.message}\n${e.filename}:${e.lineno}`));
  addEventListener('unhandledrejection', (e) => showError(e.reason && e.reason.stack || e.reason));
</script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
