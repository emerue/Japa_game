<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#F2B705">
<title>JAPA</title>
<link rel="preload" href="./assets/fonts/Bungee-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="./assets/fonts/fonts.css">
<link rel="stylesheet" href="./src/hud/hud.css">
<script type="importmap">
{ "imports": {
  "three": "./vendor/three/three.module.min.js",
  "three/addons/": "./vendor/three/addons/"
} }
</script>
</head>
<body>
<script>
  // Development aid: show errors on screen (the test phone has no visible console).
  // Testers screenshot this and send it with their feedback; the details tell us what broke.
  const showError = (msg) => document.body.insertAdjacentHTML('beforeend',
    `<div style="position:fixed;left:12px;right:12px;bottom:12px;z-index:99;padding:12px 14px;background:#C74742;color:#fff;border:3px solid #191B1E;border-radius:12px;font:600 15px/1.35 system-ui">Something broke. Take a screenshot and send it with your feedback.<pre style="margin:8px 0 0;font:11px/1.3 monospace;white-space:pre-wrap;opacity:.9">${String(msg).replace(/</g, '&lt;')}</pre></div>`);
  addEventListener('error', (e) => showError(`${e.message}\n${e.filename}:${e.lineno}`));
  addEventListener('unhandledrejection', (e) => showError(e.reason && e.reason.stack || e.reason));
</script>
<script type="module" src="./src/app.js"></script>
</body>
</html>
